<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#eee2cf">

  <title>SENZO — Neapolitan Pizzeria</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="book">

    <div class="book-stage" id="bookStage">

      <button
        class="arrow arrow-left"
        id="prev"
        aria-label="Previous menu page"
      >
        ‹
      </button>


      <div class="page" id="page">

        <img
          id="menuImage"
          src="https://raw.githubusercontent.com/dimitragilova-perfecto/senzo-menu/main/foods.jpeg"
          alt="SENZO food menu"
        >

      </div>


      <button
        class="arrow arrow-right"
        id="next"
        aria-label="Next menu page"
      >
        ›
      </button>

    </div>


    <div class="book-controls">

      <button
        class="dot active"
        data-page="0"
        aria-label="Food menu"
      ></button>

      <button
        class="dot"
        data-page="1"
        aria-label="Drinks menu"
      ></button>

      <button
        class="dot"
        data-page="2"
        aria-label="Desserts menu"
      ></button>

      <span
        class="page-number"
        id="pageNumber"
      >
        01 / 03
      </span>

    </div>


    <p class="hint" id="hint">
      USE THE ARROWS TO TURN THE MENU
    </p>

  </main>


  <script src="script.js"></script>

</body>

</html>
