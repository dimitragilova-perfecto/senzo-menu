<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#541b2b">
  <title>SENZO | Neapolitan Pizzeria</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="senzo" class="site">
    <header class="site-header">
      <p class="eyebrow">NEAPOLITAN PIZZERIA</p>
      <h1>SENZO</h1>
      <p class="header-note">A little taste of Italy</p>
    </header>

    <section class="menu-section" aria-label="Food menu">
      <div class="menu-image-wrap food-menu">
        <img
          src="https://i.postimg.cc/xdG58HdH/CD02D57A-72CE-478C-8CC5-69A95854A84D.jpg"
          alt="SENZO food menu"
          class="menu-image"
        >
        <div class="hotspot-layer" aria-label="Tap a pizza to view it">
          <!-- These hotspots are approximate and can be adjusted in style.css. -->
          <button class="hotspot" style="--top:20.5%;--left:50%;--width:46%;--height:3.3%" data-pizza="Margherita" aria-label="View Margherita pizza"></button>
          <button class="hotspot" style="--top:24.5%;--left:50%;--width:46%;--height:3.3%" data-pizza="Marinara" aria-label="View Marinara pizza"></button>
          <button class="hotspot" style="--top:28.4%;--left:50%;--width:46%;--height:3.3%" data-pizza="Diavola" aria-label="View Diavola pizza"></button>
          <button class="hotspot" style="--top:32.3%;--left:50%;--width:46%;--height:3.3%" data-pizza="Quattro Formaggi" aria-label="View Quattro Formaggi pizza"></button>
          <button class="hotspot" style="--top:36.2%;--left:50%;--width:46%;--height:3.3%" data-pizza="Capricciosa" aria-label="View Capricciosa pizza"></button>
          <button class="hotspot" style="--top:40.1%;--left:50%;--width:46%;--height:3.3%" data-pizza="Napoli" aria-label="View Napoli pizza"></button>
          <button class="hotspot" style="--top:44%;--left:50%;--width:46%;--height:3.3%" data-pizza="Prosciutto e Funghi" aria-label="View Prosciutto e Funghi pizza"></button>
          <button class="hotspot" style="--top:47.9%;--left:50%;--width:46%;--height:3.3%" data-pizza="Burrata e Crudo" aria-label="View Burrata e Crudo pizza"></button>
          <button class="hotspot" style="--top:51.8%;--left:50%;--width:46%;--height:3.3%" data-pizza="Mortadella e Pistacchio" aria-label="View Mortadella e Pistacchio pizza"></button>
          <button class="hotspot" style="--top:55.7%;--left:50%;--width:46%;--height:3.3%" data-pizza="Salsiccia e Friarielli" aria-label="View Salsiccia e Friarielli pizza"></button>
          <button class="hotspot" style="--top:59.6%;--left:50%;--width:46%;--height:3.3%" data-pizza="Bosco al Tartufo" aria-label="View Bosco al Tartufo pizza"></button>
          <button class="hotspot" style="--top:63.5%;--left:50%;--width:46%;--height:3.3%" data-pizza="'Nduja e Burrata" aria-label="View Nduja e Burrata pizza"></button>
          <button class="hotspot" style="--top:67.4%;--left:50%;--width:46%;--height:3.3%" data-pizza="Zucca e Gorgonzola" aria-label="View Zucca e Gorgonzola pizza"></button>
          <button class="hotspot" style="--top:71.3%;--left:50%;--width:46%;--height:3.3%" data-pizza="Pesto e Stracciatella" aria-label="View Pesto e Stracciatella pizza"></button>
        </div>
      </div>
      <p class="tap-hint"><span class="tap-dot"></span> Tap a pizza name to discover it</p>
    </section>

    <section class="menu-section" aria-label="Drinks menu">
      <img
        src="https://i.postimg.cc/rFvN9g0N/330DFC3C-41B1-44BE-94DC-7021E7761315.jpg"
        alt="SENZO drinks menu"
        class="menu-image"
        loading="lazy"
      >
    </section>

    <section class="menu-section" aria-label="Desserts menu">
      <img
        src="https://i.postimg.cc/13GwrS1d/678BE852-7EA9-4CDA-971A-7201A5B438C6.jpg"
        alt="SENZO desserts menu"
        class="menu-image"
        loading="lazy"
      >
    </section>

    <footer class="site-footer">SENZO · MADE WITH AMORE</footer>
  </main>

  <section id="pizza-detail" class="detail-screen" aria-hidden="true">
    <button id="back-button" class="back-button" type="button"><span aria-hidden="true">←</span> Back to menu</button>
    <div class="detail-content">
      <p class="detail-eyebrow">SENZO · PIZZA NAPOLETANA</p>
      <h2 id="detail-name">Margherita</h2>
      <p id="detail-description" class="detail-description"></p>
      <p id="detail-price" class="detail-price"></p>
      <div class="detail-photo-frame">
        <img id="detail-photo" src="" alt="" class="detail-photo">
      </div>
      <p class="detail-footnote">Simple ingredients. Extraordinary feeling.</p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
